---

name: 'dbsql_dbt_tpch'
version: '1.0.0'
config-version: 2

profile: 'sql_endpoints'

vars:
  scalefactor: 100
  benchmark: 100
  stage: stagename
  stagingschema: TPCDI_100_DBSQL_100_STAGE
  catalog: tpcdi
  prodschema: tpcdi_100_snowflake_100

model-paths: ["Snowflake/models/"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['dbsql_dbt_tpch', 'dbt_utils']

models:
  +transient: false
